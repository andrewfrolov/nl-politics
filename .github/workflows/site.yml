name: Refresh data and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch parliament data (weekly / manual runs only)
        if: github.event_name != 'push'
        run: |
          python3 pipeline/fetch_tk.py
          python3 pipeline/fetch_ek.py || echo "::warning::Senate member list could not be refreshed; keeping previous file"

      - name: Build index and statistics
        run: python3 pipeline/build_index.py --lenient

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated
          git diff --cached --quiet || git commit -m "Weekly parliament data refresh"
          git push

      - name: Assemble site
        run: |
          mkdir _site
          cp app/index.html app/styles.css app/app.js _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
